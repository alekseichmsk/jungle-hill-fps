function igniteSolid(so){if(so.burnt||so.burning)return;so.burning=true;const fl=[];if(so.kind=='palm'&&PB){so.meshes[0].scale.x=so.meshes[0].scale.y*PB[0].userData.asp;so.meshes[0].material.map=PB[0]}else{const n=so.kind=='hut'?(HF?4:6):3;for(let i=0;i<n;i++){const a=i/n*6.28+Math.random()*.5,rr=so.kind=='hut'?2.2:.4;fl.push(so.kind=='hut'&&HF?addFlame(so.x+Math.cos(a)*rr,-.1,so.z+Math.sin(a)*rr,3.2+Math.random(),HF):addFlame(so.x+Math.cos(a)*rr,Math.random()*so.h,so.z+Math.sin(a)*rr,so.kind=='hut'?1.6:1.4))}}
fires.push({x:so.x,z:so.z,t:8,kind:'solid',so,fl,sp:1})}
function igniteEnemy(e){if(e.burn>0||!e.alive)return;e.burn=4;e.zz=0;if(SB){e.fl=null;e.s.scale.set(1.9*SB[0].userData.asp,1.9,1);e.s.position.y=.95}else e.fl=addFlame(e.s.position.x,.2,e.s.position.z,1.5);startScream(e)}
function burnEnemy(e,dt){const p=e.s.position;e.burn-=dt;e.zz-=dt;if(e.zz<=0){e.zz=.25+Math.random()*.35;e.dir=Math.random()*6.28}
const nx=p.x+Math.cos(e.dir)*3.2*dt,nz=p.z+Math.sin(e.dir)*3.2*dt;if(!blocked(nx,nz)){p.x=nx;p.z=nz}else e.zz=0;e.walk+=dt*3;
e.s.material.map=SB?SB[Math.floor(e.walk*3)%4]:(Math.floor(e.walk*4)%2?ET[3]:ET[2]);if(e.fl)e.fl.position.set(p.x,.95,p.z);if(Math.random()<dt*6)smoke(p.x,1.6,p.z);
for(const o of enemies)if(o!==e&&o.alive&&!(o.burn>0)&&o.s.position.distanceTo(p)<1.4)igniteEnemy(o);
if(Math.random()<dt*3)igniteGround(p.x,p.z);
if(e.burn<=0){e.alive=false;stopScream(e);if(e.fl)S.remove(e.fl);e.s.material.map=CORPSE;if(IMG_CORPSE){e.s.scale.set(2.2,2.2*IMG_CORPSE.height/IMG_CORPSE.width,1);e.s.position.y=.42}else{e.s.scale.set(1.8,1.0,1);e.s.position.y=.35}e.corpse=true;corpses.push(e);SFX.hit()}}
const corpses=[];
const CORPSE=IMG_CORPSE?(()=>{const t=new THREE.Texture(IMG_CORPSE);t.needsUpdate=true;t.magFilter=t.minFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;return t})():tex(IMG_EN?IMG_EN.height:24,IMG_EN?IMG_EN.width:16,g=>{const W_=IMG_EN?IMG_EN.width:16,H_=IMG_EN?IMG_EN.height:24;g.translate(0,W_);g.rotate(-Math.PI/2);if(IMG_EN)g.drawImage(IMG_EN,0,0);else{g.fillStyle='#333';g.fillRect(3,0,10,24)}
g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-atop';g.fillStyle='rgba(18,12,8,.88)';g.fillRect(0,0,H_,W_);g.fillStyle='rgba(255,90,0,.5)';for(let i=0;i<12;i++)g.fillRect(Math.random()*H_,Math.random()*W_,2,1)});
function updateFires(dt){fireT+=dt;const fr=Math.floor(fireT*10);
for(let i=fires.length-1;i>=0;i--){const f=fires[i];f.t-=dt;f.fl.forEach((s,k)=>{const st=s.userData.set||FL;s.material.map=st[(fr+k+(s.userData.ph|0))%st.length]});if(f.kind=='solid'&&f.so.kind=='palm'&&PB)f.so.meshes[0].material.map=PB[Math.min(3,Math.floor((8-f.t)/2))];
if(Math.random()<dt*(f.kind=='solid'?8:2))smoke(f.x+(Math.random()-.5)*(f.kind=='solid'?3:.6),f.kind=='solid'?f.so.h:1,f.z+(Math.random()-.5)*(f.kind=='solid'?3:.6));
// spread
if(Math.random()<dt*f.sp){const a=Math.random()*6.28,r=f.kind=='solid'?2.6:1.3;igniteGround(f.x+Math.cos(a)*r,f.z+Math.sin(a)*r)}
for(const so of solids)if(!so.burning&&!so.burnt&&Math.hypot(so.x-f.x,so.z-f.z)<so.r+.7&&Math.random()<dt*.8)igniteSolid(so);
for(const e of enemies)if(e.alive&&!(e.burn>0)&&Math.hypot(e.s.position.x-f.x,e.s.position.z-f.z)<(f.kind=='solid'?2.6:.9))igniteEnemy(e);
if(Math.hypot(P.x-f.x,P.z-f.z)<(f.kind=='solid'?2.4:.7)&&DEMO!='fire'){P.hp-=8*dt}
if(f.t<=0){f.fl.forEach(s=>S.remove(s));fires.splice(i,1);
if(f.kind=='grass'){const sz=1.3+Math.random()*.7,d=new THREE.Mesh(IMG_SCORCH?new THREE.PlaneGeometry(sz,sz*IMG_SCORCH.height/IMG_SCORCH.width):new THREE.CircleGeometry(sz/2,7),scorchM);d.rotation.z=Math.random()*6.28;d.rotation.x=-Math.PI/2;d.position.set(f.x,.02+Math.random()*.01,f.z);S.add(d)}
else{f.so.burning=false;f.so.burnt=true;if(f.so.kind=='palm'&&PB){f.so.meshes[0].material.map=PB[3];f.so.meshes[0].material.color.setHex(0x3a3330)}else f.so.meshes.forEach(m=>m.material.color.setHex(0x4a3a30))}}}
// flame particles ignite
for(const q of parts){if(!q.userData.burn||q.userData.done)continue;const p=q.position;
if(q.userData.l<.15||p.y<.3){q.userData.done=true;if(Math.random()<.5)igniteGround(p.x,p.z)}
for(const so of solids)if(!so.burnt&&!so.burning&&Math.hypot(so.x-p.x,so.z-p.z)<so.r+.4&&p.y<so.h+1){igniteSolid(so);q.userData.done=true;break}}
for(const c of corpses)if(Math.random()<dt*1.5)smoke(c.s.position.x,.6,c.s.position.z)}
// scream (procedural)
function startScream(e){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter(),g=AC.createGain();
o.type='sawtooth';o2.type='square';const base=480+Math.random()*260;o.frequency.value=base;o2.frequency.value=base*1.51;l.frequency.value=6+Math.random()*4;lg.gain.value=70;l.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
f.type='bandpass';f.frequency.value=1300;f.Q.value=3;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.08);
// wail: pitch wobble loop
const w=AC.createOscillator(),wg=AC.createGain();w.frequency.value=.9;wg.gain.value=120;w.connect(wg).connect(o.frequency);
o.connect(f);o2.connect(f);f.connect(g).connect(master);[o,o2,l,w].forEach(n=>n.start(t));e.scr={g,nodes:[o,o2,l,w]}}
function stopScream(e){if(!e.scr||!AC)return;const t=AC.currentTime;e.scr.g.gain.cancelScheduledValues(t);e.scr.g.gain.setValueAtTime(e.scr.g.gain.value,t);e.scr.g.gain.linearRampToValueAtTime(0,t+.06);e.scr.nodes.forEach(n=>n.stop(t+.1));e.scr=null}
function blocked(x,z){for(const s of solids)if(Math.hypot(x-s.x,z-s.z)<s.r+.3)return true;return Math.abs(x)>37||Math.abs(z)>37}
let moving=false;
function updatePlayer(dt){let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyA)s-=1;if(keys.KeyD)s+=1;if(keys.ArrowLeft)P.yaw+=2*dt;if(keys.ArrowRight)P.yaw-=2*dt;
f-=jv.y;s+=jv.x;moving=dt>0&&Math.abs(f)+Math.abs(s)>.1;const sp=5*dt*(Math.abs(P.x-12)<3?.5:1);
const dx=(-Math.sin(P.yaw)*f+Math.cos(P.yaw)*s)*sp,dz=(-Math.cos(P.yaw)*f-Math.sin(P.yaw)*s)*sp;
if(!blocked(P.x+dx,P.z))P.x+=dx;if(!blocked(P.x,P.z+dz))P.z+=dz;
cam.position.set(P.x,1.5+(moving?Math.sin(performance.now()/90)*.05:0),P.z);cam.rotation.set(P.pitch,P.yaw,0,'YXZ')}
function updateEnemies(dt){for(const e of enemies){if(!e.alive)continue;const p=e.s.position,dx=P.x-p.x,dz=P.z-p.z,d=Math.hypot(dx,dz);
if(e.burn>0){burnEnemy(e,dt);continue}
if(d>6&&d<28){const nx=p.x+dx/d*1.4*dt,nz=p.z+dz/d*1.4*dt;if(!blocked(nx,nz)){p.x=nx;p.z=nz}e.walk+=dt}
e.cd-=dt;if(d<26&&e.cd<0){e.cd=1.6+Math.random()*1.5;e.flash=.15;if(d<20)SFX.enemyShot();const m=TRF?new THREE.Sprite(new THREE.SpriteMaterial({map:TRF[1],transparent:true,alphaTest:.4,fog:false})):new THREE.Mesh(tg,tracerM);if(TRF)m.scale.set(1.1,1.1*IMG_TR.height/(IMG_TR.width/4),1);m.position.set(p.x,1.2,p.z);const v=new THREE.Vector3(dx,0,dz).normalize().multiplyScalar(7);if(!TRF)m.lookAt(p.x+v.x,1.2,p.z+v.z);m.userData={v,l:6};S.add(m);shots.push(m)}
e.flash=(e.flash||0)-dt;e.hurt-=dt;e.s.material.map=e.hurt>0?ET[2]:e.flash>0?ET[1]:(Math.floor(e.walk*4)%2?ET[3]:ET[0]);
if(!(e.burn>0))for(const q of parts)if(q.userData.burn&&q.position.distanceTo(p)<1.1){igniteEnemy(e);break}}}
function updateShots(dt){for(let i=shots.length-1;i>=0;i--){const m=shots[i];m.position.addScaledVector(m.userData.v,dt);if(TRF){const u=m.userData;u.f=(u.f||0)+dt;m.material.map=TRF[1+(Math.floor(u.f*20)%3)];
_a.copy(m.position).project(cam);_b.copy(m.position).add(u.v).project(cam);const ar=cam.aspect;let dx=(_b.x-_a.x)*ar,dy=_b.y-_a.y;if(_b.z>1||_a.z>1){dx=-dx;dy=-dy}
_b.copy(cam.position).sub(m.position).normalize();const head=_b.dot(_a.copy(u.v).normalize())>.75;m.material.rotation=Math.atan2(dy,dx);if(head){m.material.map=TRF[0];m.scale.set(.35,.35*IMG_TR.height/(IMG_TR.width/4)*2,1)}else m.scale.set(1.1,1.1*IMG_TR.height/(IMG_TR.width/4),1)}m.userData.l-=dt;
if(Math.hypot(m.position.x-P.x,m.position.z-P.z)<.45){if(DEMO!='combat')P.hp-=10;SFX.hit();document.getElementById('flash').style.opacity=.4;m.userData.l=0}
if(m.userData.l<=0||blocked(m.position.x,m.position.z)){S.remove(m);shots.splice(i,1)}}
for(let i=parts.length-1;i>=0;i--){const o=parts[i],u=o.userData;o.position.addScaledVector(u.v,dt);if(u.g){u.v.y-=12*dt;if(o.position.y<.05){o.position.y=.05;u.v.set(0,0,0)}}u.l-=dt;if(u.l<=0){S.remove(o);parts.splice(i,1)}}}
const FONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',':':'000010000010000','-':'000000111000000','%':'101001010100101'};
const digCache={};function dig(id,str){if(digCache[id]===str)return;digCache[id]=str;const c=document.getElementById(id),g=c.getContext('2d'),n=str.length;c.width=n*4;c.height=6;c.style.width=(c.clientHeight?n*4*c.clientHeight/6:n*17)+'px';
for(let i=0;i<n;i++)for(let k=0;k<15;k++){g.fillStyle='#3a0a04';g.fillRect(i*4+k%3+1,(k/3|0)+1,1,1)}
for(let i=0;i<n;i++){const p=FONT[str[i]]||'';for(let k=0;k<15;k++)if(p[k]=='1'){const x=i*4+k%3,y=k/3|0;g.fillStyle=y==0?'#ff8a40':'#ff2a10';g.fillRect(x,y,1,1)}}}
(()=>{const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');for(let y=0;y<32;y++)for(let x=0;x<32;x++){const v=Math.random()*18|0;g.fillStyle=`rgb(${70+v},${78+v},${52+v})`;g.fillRect(x,y,1,1)}
for(const[x,y]of[[2,2],[29,2],[2,29],[29,29]]){g.fillStyle='#2e3220';g.fillRect(x,y,2,2);g.fillStyle='#a8b088';g.fillRect(x,y,1,1)}
document.getElementById('hud').style.backgroundImage=`url(${c.toDataURL()})`})();
function hud(){const w=W[P.w];document.getElementById('wname').textContent=w.n;dig('ammo',w.ammo===Infinity?'--':String(w.ammo));dig('hp',String(Math.max(0,P.hp|0))+'%');
const t=time|0;dig('clock',String((t/60|0)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0'));
const al=enemies.filter(e=>e.alive).length;document.getElementById('en').textContent=al+'/'+enemies.length;
names.forEach((n,i)=>{const b=document.getElementById('b'+i);b.style.width=squadHP[i]+'%';b.style.background=squadHP[i]<40?'#c30':'#3c0'});drawFace();
const fl=document.getElementById('flash');fl.style.opacity=Math.max(0,fl.style.opacity-.02);
if(!over&&(al==0||P.hp<=0)){over=true;tv.style.display='none';msg.style.display='flex';document.getElementById('logo').textContent=al==0?'ВЫСОТА ВЗЯТА!':'ТЫ ПОГИБ';document.getElementById('intro').textContent=al==0?'Все враги уничтожены. Миссия 1 «Тропа» пройдена.':'Отряд отступает...';document.querySelectorAll('.mi').forEach(b=>b.style.display='none');document.getElementById('panel').innerHTML='';document.getElementById('start').textContent='ЗАНОВО';document.exitPointerLock?.()}}
function resize(){const w=innerWidth,h=innerHeight-110;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
if(DEMO){begin();if(DEMO=='start'){msg.style.display='flex';started=false}
if(DEMO=='combat'){P.z=-4;firing=true;P.hp=64;P.w=0;enemies.forEach((e,i)=>{if(i<4){e.s.position.set(-3+i*2,.9,-9);e.cd=.1*i}});setTimeout(()=>{hit(enemies[1],99,enemies[1].s.position.clone().setY(1.2))},300)}
if(DEMO=='flame'){P.w=2;firing=true;P.z=-7;enemies[0].s.position.set(0,.9,-10)}
if(DEMO=='hut'){P.x=-6;P.z=-3.5;P.yaw=0.15;P.pitch=.15;enemies.forEach(e=>e.s.position.x+=40)}
if(DEMO=='tower'){P.x=-10;P.z=-10;P.yaw=0.5;P.pitch=.25}
if(DEMO=='tracer'){P.z=-4;enemies.forEach((e,i)=>{if(i<3){e.s.position.set(-4+i*4,.9,-12);e.cd=.05}else e.s.position.x+=60})}
if(DEMO=='flame'){P.w=2;firing=true;P.z=-7;enemies[0].s.position.set(0,.9,-11)}
if(DEMO=='fire'){P.w=2;P.z=-3;P.x=-6;P.yaw=0;firing=true;enemies.forEach((e,i)=>{if(i<3)e.s.position.set(-8+i*2,.9,-12);else e.s.position.x+=60});setTimeout(()=>{firing=false},2200)}
if(DEMO=='pistol'){P.w=3;P.z=-4}
if(DEMO=='burn'){P.z=-2;P.x=0;enemies.forEach((e,i)=>{if(i<2){e.s.position.set(-2+i*4,.9,-9)}else e.s.position.x+=60});setTimeout(()=>enemies.slice(0,2).forEach(igniteEnemy),200)}
if(DEMO=='corpse'){P.z=-2;enemies.forEach((e,i)=>{if(i<2){e.s.position.set(-1.5+i*3,.9,-6)}else e.s.position.x+=60});setTimeout(()=>enemies.slice(0,2).forEach(e=>{igniteEnemy(e);e.burn=.05}),200)}
if(DEMO=='palm'){P.x=0;P.z=-2;P.w=2;firing=true;const so=solids.filter(x=>x.kind=='palm').sort((a,b)=>Math.hypot(a.x,a.z+2)-Math.hypot(b.x,b.z+2))[0];P.yaw=Math.atan2(-(so.x-P.x),-(so.z-P.z));setTimeout(()=>{firing=false;igniteSolid(so)},300)}
if(DEMO=='flameidle'){P.w=2;P.z=-4}
if(DEMO=='pistolfire'){P.w=3;P.z=-4;firing=true}
if(DEMO=='win'){enemies.forEach(e=>{e.alive=false;S.remove(e.s)})}}
let last=performance.now(),T=0;
function loop(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));muzzle-=dt;if(!firing)muzzle=0;last=now;T+=dt;
if(started&&!over){time+=dt*2;updatePlayer(dt);updateEnemies(dt);shotCd-=dt;if(firing&&shotCd<=0){shoot();shotCd=W[P.w].rate}}else updatePlayer(0);
updateShots(dt);if(started)updateFires(dt);hud();if(flameG)flameG.gain.setTargetAtTime(started&&!over&&firing&&P.w==2&&W[2].ammo>0?.5:0,AC.currentTime,.05);
if(AC&&moving&&started&&!over&&T-lastStep>.38){lastStep=T;SFX.step()}drawGun(T);R.render(S,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
