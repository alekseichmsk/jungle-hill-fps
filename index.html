const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jv={x:0,y:0},jid=null;
function jmove(t){const r=joy.getBoundingClientRect();let dx=t.clientX-r.left-60,dy=t.clientY-r.top-60;const l=Math.hypot(dx,dy);if(l>50){dx*=50/l;dy*=50/l}jv={x:dx/50,y:dy/50};knob.style.left=35+dx+'px';knob.style.top=35+dy+'px'}
joy.addEventListener('touchstart',e=>{e.preventDefault();jid=e.changedTouches[0].identifier;jmove(e.changedTouches[0])});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===jid)jmove(t)});
joy.addEventListener('touchend',e=>{jid=null;jv={x:0,y:0};knob.style.left=knob.style.top='35px'});
const look=document.getElementById('look');let lid=null,lx=0,ly=0;
look.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];lid=t.identifier;lx=t.clientX;ly=t.clientY});
look.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===lid){P.yaw-=(t.clientX-lx)*.006;P.pitch=Math.max(-.6,Math.min(.6,P.pitch-(t.clientY-ly)*.004));lx=t.clientX;ly=t.clientY}});
look.addEventListener('touchend',()=>lid=null);
function mdown(){if(coarse)return;if(!document.pointerLockElement)document.body.requestPointerLock?.();firing=true}
look.addEventListener('mousedown',mdown);cv.addEventListener('mousedown',mdown);
const fb=document.getElementById('fire');fb.addEventListener('touchstart',e=>{e.preventDefault();firing=true});fb.addEventListener('touchend',()=>firing=false);
fb.addEventListener('mousedown',e=>{e.stopPropagation();firing=true});
document.getElementById('wsw').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();P.w=(P.w+1)%3});
const msg=document.getElementById('msg');
function begin(){msg.style.display='none';started=true;tv.pause()}
document.getElementById('start').onclick=()=>{if(over)location.href=location.pathname;else begin()};
const ray=new THREE.Raycaster();
function shoot(){const w=W[P.w];if(w.ammo<=0)return;w.ammo--;muzzle=.06;if(P.w==0)SFX.m16();if(P.w==1)SFX.shotgun();
const fwd=new THREE.Vector3();cam.getWorldDirection(fwd);
if(w.fire){const o=cam.position.clone().addScaledVector(fwd,1.6);o.y-=.35;for(let i=0;i<3;i++){const m=new THREE.Mesh(pg,Math.random()<.5?pm.fire:pm.fire2);m.position.copy(o);m.scale.setScalar(1.5);m.userData={v:fwd.clone().multiplyScalar(9).add(new THREE.Vector3((Math.random()-.5)*2,(Math.random()-.5),(Math.random()-.5)*2)),l:.7,g:false,burn:true};S.add(m);parts.push(m)}return}
for(let p=0;p<w.pel;p++){const d=fwd.clone().add(new THREE.Vector3((Math.random()-.5)*w.spread,(Math.random()-.5)*w.spread,(Math.random()-.5)*w.spread)).normalize();ray.set(cam.position,d);ray.camera=cam;
const hits=ray.intersectObjects(enemies.filter(e=>e.alive).map(e=>e.s));if(hits[0]&&hits[0].distance<40){hit(enemies.find(e=>e.s===hits[0].object),w.dmg,hits[0].point)}}}
function hit(e,d,pt){if(e.alive&&Math.random()<.5)SFX.hit();if(e.hp-d<=0&&e.alive){SFX.death();if(P.w!=0)SFX.explosion()}e.hp-=d;e.hurt=.15;part(pt.x,pt.y,pt.z,pm.blood,6,3,.6);if(e.hp<=0&&e.alive){e.alive=false;S.remove(e.s);const p=e.s.position;part(p.x,1,p.z,pm.gib,10,5,1.4);part(p.x,1,p.z,pm.blood,25,5,1);for(let i=0;i<4;i++)splat(p.x,p.z)}}
function blocked(x,z){for(const s of solids)if(Math.hypot(x-s.x,z-s.z)<s.r+.3)return true;return Math.abs(x)>37||Math.abs(z)>37}
let moving=false;
function updatePlayer(dt){let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyA)s-=1;if(keys.KeyD)s+=1;if(keys.ArrowLeft)P.yaw+=2*dt;if(keys.ArrowRight)P.yaw-=2*dt;
f-=jv.y;s+=jv.x;moving=dt>0&&Math.abs(f)+Math.abs(s)>.1;const sp=5*dt*(Math.abs(P.x-12)<3?.5:1);
const dx=(-Math.sin(P.yaw)*f+Math.cos(P.yaw)*s)*sp,dz=(-Math.cos(P.yaw)*f-Math.sin(P.yaw)*s)*sp;
if(!blocked(P.x+dx,P.z))P.x+=dx;if(!blocked(P.x,P.z+dz))P.z+=dz;
cam.position.set(P.x,1.5+(moving?Math.sin(performance.now()/90)*.05:0),P.z);cam.rotation.set(P.pitch,P.yaw,0,'YXZ')}
function updateEnemies(dt){for(const e of enemies){if(!e.alive)continue;const p=e.s.position,dx=P.x-p.x,dz=P.z-p.z,d=Math.hypot(dx,dz);
if(d>6&&d<28){const nx=p.x+dx/d*1.4*dt,nz=p.z+dz/d*1.4*dt;if(!blocked(nx,nz)){p.x=nx;p.z=nz}e.walk+=dt}
e.cd-=dt;if(d<26&&e.cd<0){e.cd=1.6+Math.random()*1.5;e.flash=.15;if(d<20)SFX.enemyShot();const m=new THREE.Mesh(tg,tracerM);m.position.set(p.x,1.2,p.z);const v=new THREE.Vector3(dx,0,dz).normalize().multiplyScalar(7);m.lookAt(p.x+v.x,1.2,p.z+v.z);m.userData={v,l:6};S.add(m);shots.push(m)}
e.flash=(e.flash||0)-dt;e.hurt-=dt;e.s.material.map=e.hurt>0?ET[2]:e.flash>0?ET[1]:(Math.floor(e.walk*4)%2?ET[3]:ET[0]);
for(const q of parts)if(q.userData.burn&&q.position.distanceTo(p)<1){e.hp-=60*dt;e.hurt=.1;if(Math.random()<.2)part(p.x,1,p.z,pm.fire,1,2,.5);if(e.hp<=0)hit(e,0,p);break}}}
function updateShots(dt){for(let i=shots.length-1;i>=0;i--){const m=shots[i];m.position.addScaledVector(m.userData.v,dt);m.userData.l-=dt;
if(Math.hypot(m.position.x-P.x,m.position.z-P.z)<.45){P.hp-=10;SFX.hit();document.getElementById('flash').style.opacity=.4;m.userData.l=0}
if(m.userData.l<=0||blocked(m.position.x,m.position.z)){S.remove(m);shots.splice(i,1)}}
for(let i=parts.length-1;i>=0;i--){const o=parts[i],u=o.userData;o.position.addScaledVector(u.v,dt);if(u.g){u.v.y-=12*dt;if(o.position.y<.05){o.position.y=.05;u.v.set(0,0,0)}}u.l-=dt;if(u.l<=0){S.remove(o);parts.splice(i,1)}}}
function hud(){const w=W[P.w];document.getElementById('wname').textContent=w.n;document.getElementById('ammo').textContent=w.ammo;document.getElementById('hp').textContent=Math.max(0,P.hp|0);
const t=time|0;document.getElementById('clock').textContent=String((t/60|0)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const al=enemies.filter(e=>e.alive).length;document.getElementById('en').textContent=al+'/'+enemies.length;
names.forEach((n,i)=>{const b=document.getElementById('b'+i);b.style.width=squadHP[i]+'%';b.style.background=squadHP[i]<40?'#c30':'#3c0'});drawFace();
const fl=document.getElementById('flash');fl.style.opacity=Math.max(0,fl.style.opacity-.02);
if(!over&&(al==0||P.hp<=0)){over=true;tv.style.display='none';msg.style.display='flex';msg.querySelector('h1').textContent=al==0?'ВЫСОТА ВЗЯТА!':'ТЫ ПОГИБ';msg.querySelector('div').textContent=al==0?'Все враги уничтожены.':'Отряд отступает...';document.getElementById('start').textContent='ЗАНОВО';document.exitPointerLock?.()}}
function resize(){const w=innerWidth,h=innerHeight-110;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
if(DEMO){begin();if(DEMO=='start'){msg.style.display='flex';started=false}
if(DEMO=='combat'){P.z=-4;firing=true;P.hp=64;P.w=0;enemies.forEach((e,i)=>{if(i<4){e.s.position.set(-3+i*2,.9,-9);e.cd=.1*i}});setTimeout(()=>{hit(enemies[1],99,enemies[1].s.position.clone().setY(1.2))},300)}
if(DEMO=='flame'){P.w=2;firing=true;P.z=-7;enemies[0].s.position.set(0,.9,-10)}
if(DEMO=='hut'){P.x=-6;P.z=-3.5;P.yaw=0.15;P.pitch=.15;enemies.forEach(e=>e.s.position.x+=40)}
if(DEMO=='tower'){P.x=-10;P.z=-10;P.yaw=0.5;P.pitch=.25}
if(DEMO=='win'){enemies.forEach(e=>{e.alive=false;S.remove(e.s)})}}
let last=performance.now(),T=0;
function loop(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;T+=dt;
if(started&&!over){time+=dt*2;updatePlayer(dt);updateEnemies(dt);shotCd-=dt;muzzle-=dt;if(firing&&shotCd<=0){shoot();shotCd=W[P.w].rate}}else updatePlayer(0);
updateShots(dt);hud();if(flameG)flameG.gain.setTargetAtTime(started&&!over&&firing&&P.w==2&&W[2].ammo>0?.5:0,AC.currentTime,.05);
if(AC&&moving&&started&&!over&&T-lastStep>.38){lastStep=T;SFX.step()}drawGun(T);R.render(S,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
