<p id="intro">Долина Ашау, 1969. Командование называет её высотой 937. Мы зовём её просто холмом. Восемь человек. Три дня. Приказ — взять вершину. Никто не сказал, зачем.</p>

<script type="module">
import * as THREE from 'three';
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});

const MIMG={};await Promise.all(['m1_rifleman','m1_death','gore','grass','tex_trail','sky_m1','sky_m2','sky_m3','sky_m4','sky_m5','sky_morning','mg_nest','river','explosion','tunnel_enemy','rpg','boss','sandbags','hatch','crate','marty','briefing_m1','briefing_m2','briefing_m3','briefing_m4','briefing_m5'].map(async n=>{MIMG[n]=await loadImg('sprites/'+n+'.png')}));
const tv=document.getElementById('tv');
let AC=null,NB=null,master,flameG,lastStep=0;
function initAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
// flame loop
const fs=AC.createBufferSource();fs.buffer=NB;fs.loop=true;const ff=AC.createBiquadFilter();ff.type='lowpass';ff.frequency.value=900;flameG=AC.createGain();flameG.gain.value=0;fs.connect(ff).connect(flameG).connect(master);fs.start();
// ambience: insects
const as=AC.createBufferSource();as.buffer=NB;as.loop=true;const af=AC.createBiquadFilter();af.type='bandpass';af.frequency.value=5200;af.Q.value=8;const ag=AC.createGain();ag.gain.value=.05;
const lfo=AC.createOscillator();lfo.frequency.value=7;const lg=AC.createGain();lg.gain.value=.04;lfo.connect(lg).connect(ag.gain);lfo.start();as.connect(af).connect(ag).connect(master);as.start();
setInterval(()=>{if(Math.random()<.5)bird()},1800)}
function env(node,t,a,peak,dec){const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.001,t+a+dec);node.connect(g).connect(master);return g}
function snd(type,freq,peak,dec,q=1,dly=0){if(!AC)return;const t=AC.currentTime+dly,s=AC.createBufferSource();s.buffer=NB;s.playbackRate.value=.5+Math.random();const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;s.connect(f);env(f,t,.002,peak,dec);s.start(t,Math.random());s.stop(t+dec+.1)}
function tone(type,f0,f1,peak,dec,dly=0){if(!AC)return;const t=AC.currentTime+dly,o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dec);env(o,t,.005,peak,dec);o.start(t);o.stop(t+dec+.1)}
const SFX={m16(){snd('bandpass',1800,.6,.09,.8);tone('square',180,60,.15,.06)},
shotgun(){snd('lowpass',1400,1,.35);tone('sine',120,40,.6,.25);snd('highpass',3000,.15,.05,1,.3)},
enemyShot(){snd('bandpass',1200,.18,.12,1.5);tone('square',600,200,.04,.1)},
hit(){snd('lowpass',500,.5,.15);tone('sine',90,40,.3,.12)},
death(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),v=AC.createOscillator(),vg=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(520+Math.random()*200,t);o.frequency.exponentialRampToValueAtTime(140,t+.6);v.frequency.value=11;vg.gain.value=40;v.connect(vg).connect(o.frequency);const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=2;o.connect(f);env(f,t,.02,.25,.6);o.start(t);v.start(t);o.stop(t+.8);v.stop(t+.8);snd('lowpass',400,.5,.3)},

pistol(){snd('bandpass',2400,.5,.07,1);tone('square',260,90,.12,.05)},
